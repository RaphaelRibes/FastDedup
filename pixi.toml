[workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
description = "A fast and memory-efficient FASTX PCR deduplication tool"

[dependencies]
# Same pin as the suite: 1.99 measured 1.44x faster than 1.95 on identical source.
# Do NOT widen the lower bound without re-measuring.
rust = ">=1.99,<2"
c-compiler = "*"
cmake = "*"
pkg-config = "*"
zlib = "*"          # flate2's zlib-ng builds from source

# The conda toolchain's 2.28 sysroot links against a Scrt1.o that references
# __libc_csu_init/__libc_csu_fini; the host linker does not. Without this the
# link fails with an undefined-reference error that looks like a code bug.
[activation.env]
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/cc"

[tasks]
build = "cargo build --release"
test = "cargo test"
ci = { depends-on = ["build", "test"] }
